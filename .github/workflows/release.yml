# Publishes a release. `pnpm release:version <x.y.z>` commits the new version with its CHANGELOG.md
# section and tags it; pushing the tag (vX.Y.Z) runs this workflow: the publish job checks the tag
# against package.json, runs the checks, builds and publishes the package to npm, and the
# github-release job creates the tag's GitHub release with its changelog section as notes.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
# - NPM_PUBLISH: until it is "true", a tag push is a dry run that publishes nothing and creates no
#   GitHub release. A manual run (workflow_dispatch) is always a dry run.
# - NPM_PROVENANCE: "false" publishes without a provenance attestation; unset or anything else
#   publishes with one.
#
# npm trusts this workflow (trusted publishing: on npmjs.com, the package's Settings > Trusted
# publisher > GitHub Actions, with this repository and the workflow file release.yml), so no token
# is involved: npm exchanges the publish job's OIDC identity for one-off publish credentials.
# Provenance also needs package.json's repository.url to name this repository.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      # No registry-url: it would write an .npmrc with a token line, and a token must never stand
      # in for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check that npm supports trusted publishing (11.5.1 or later)
        run: |
          version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]]; then
            echo "::error::npm $version is too old for trusted publishing (11.5.1 or later)."
            exit 1
          fi
          echo "npm $version"

      - name: Check that the tag names package.json's version
        if: ${{ github.event_name == 'push' }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json's version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm exec publint

      - name: Publish
        env:
          DRY_RUN:
            ${{ (github.event_name == 'push' && vars.NPM_PUBLISH == 'true') && 'false' || 'true' }}
          PROVENANCE: ${{ vars.NPM_PROVENANCE != 'false' }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # A re-run after a publish (e.g. for the GitHub release) publishes nothing again.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm (skipped)"
            exit 0
          fi
          # A pre-release (x.y.z-*) must not become `latest`.
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          # The build and checks ran above: skip prepublishOnly.
          flags=(--access public --tag "$dist_tag" --ignore-scripts)
          if [[ "$DRY_RUN" == true ]]; then
            flags+=(--dry-run)
          elif [[ "$PROVENANCE" == true ]]; then
            flags+=(--provenance)
          else
            flags+=(--provenance=false)
          fi
          npm publish "${flags[@]}"

  # The GitHub release of the tag, after a real publish only (a dry run creates none): titled by the
  # tag, with the version's CHANGELOG.md section as notes, a pre-release for x.y.z-* versions. A
  # re-run updates the notes of the release it created.
  github-release:
    needs: publish
    if:
      ${{ needs.publish.result == 'success' && github.event_name == 'push' && vars.NPM_PUBLISH ==
      'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.ts "$TAG" > "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
          else
            flags=(--title "$TAG" --notes-file "$notes" --verify-tag)
            if [[ "${TAG#v}" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}"
          fi
